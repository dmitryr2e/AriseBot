name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bot:
    name: Bot (lint + tests)
    runs-on: ubuntu-latest
    # Даем этой джобе права на запись, чтобы пушить автоисправления ruff
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      # Добавлен флаг --fix для автоматического исправления импортов и стиля
      - name: Lint and Fix (ruff)
        run: ruff check bot tests --fix

      # Если ruff внес изменения, этот шаг автоматически сделает коммит и запушит его
      - name: Commit auto-fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: автоисправление импортов линтером Ruff [skip ci]"

      - name: Tests (pytest)
        run: pytest

      # Информационно: новая CVE в зависимости не должна блокировать релиз
      # фикса, но должна быть видна в логе сборки.
      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Docker build
        run: docker build -t bot-ci .

  landing:
    name: Landing (types + build)
    runs-on: ubuntu-latest
    # Для лендинга оставляем безопасные права только на чтение
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Dependency audit (pnpm)
        continue-on-error: true
        run: pnpm audit --audit-level high

      - name: Build
        run: pnpm build
