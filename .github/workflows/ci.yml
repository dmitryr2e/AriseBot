name: CI

on:
  push:
    branches: [main]
  pull_request:

# Токен воркфлоу только на чтение: CI ничего не пишет в репозиторий.
permissions:
  contents: read

jobs:
  bot:
    name: Bot (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint (ruff)
        run: ruff check bot tests

      - name: Tests (pytest)
        run: pytest

      # Информационно: новая CVE в зависимости не должна блокировать релиз
      # фикса, но должна быть видна в логе сборки.
      - name: Dependency audit (pip-audit)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Docker build
        run: docker build -t bot-ci .

  landing:
    name: Landing (types + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Dependency audit (pnpm)
        continue-on-error: true
        run: pnpm audit --audit-level high

      - name: Build
        run: pnpm build
